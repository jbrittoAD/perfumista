</defs><rect class="bg" width="760" height="276" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Syndet, do pó à barra</text><rect x="20" y="56" width="160" height="66" rx="8" fill="url(#h2)" stroke="#000" stroke-width="2.0"/><text class="lbl" x="34" y="82">1. Pesar SCI</text><text class="xs" x="34" y="102">máscara PFF2</text><path class="ar" d="M184 89 L 200 89"/><rect x="205" y="56" width="160" height="66" rx="8" fill="#f2f2f2" stroke="#000" stroke-width="1.2"/><text class="lbl" x="219" y="82">2. Fundir gorduras</text><text class="xs" x="219" y="102">70–75 °C</text><path class="ar" d="M369 89 L 385 89"/><rect x="390" y="56" width="160" height="66" rx="8" fill="#f2f2f2" stroke="#000" stroke-width="1.2"/><text class="lbl" x="404" y="82">3. SCI + betaína</text><text class="xs" x="404" y="102">70–80 °C · máx 85</text><path class="ar" d="M554 89 L 570 89"/><rect x="575" y="56" width="160" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1.2"/><text class="lbl" x="589" y="82">4. Pós e ativos</text><text class="xs" x="589" y="102">&lt; 60 °C</text><rect x="20" y="152" width="160" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1.2"/><text class="lbl" x="34" y="178">5. Perfume</text><text class="xs" x="34" y="198">por último</text><path class="ar" d="M184 185 L 200 185"/><rect x="205" y="152" width="160" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1.2"/><text class="lbl" x="219" y="178">6. Prensar</text><text class="xs" x="219" y="198">forte, sem ar</text><path class="ar" d="M369 185 L 385 185"/><rect x="390" y="152" width="160" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1.2"/><text class="lbl" x="404" y="178">7. Freezer</text><text class="xs" x="404" y="198">1–2 h</text><path class="ar" d="M554 185 L 570 185"/><rect x="575" y="152" width="160" height="66" rx="8" fill="#fff" stroke="#000" stroke-width="1.2"/><text class="lbl" x="589" y="178">8. Secar</text><text class="xs" x="589" y="198">24–48 h</text><text class="sm" x="20" y="262">A massa fica PASTOSA, não líquida — o SCI só funde a 154 °C. É assim mesmo.</text></svg>