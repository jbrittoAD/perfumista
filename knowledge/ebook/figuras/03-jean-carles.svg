<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-label="Método Jean Carles: a escada dois a dois"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="256" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Método Jean Carles: a escada dois a dois</text><rect x="30" y="71" width="56" height="99" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><rect x="92" y="159" width="56" height="11" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="88" y="192" text-anchor="middle">9:1</text><rect x="176" y="82" width="56" height="88" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><rect x="238" y="148" width="56" height="22" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="234" y="192" text-anchor="middle">8:2</text><rect x="322" y="93" width="56" height="77" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><rect x="384" y="137" width="56" height="33" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="380" y="192" text-anchor="middle">7:3</text><rect x="316" y="52" width="136" height="150" rx="6" fill="none" stroke="#000" stroke-width="2.4" stroke-dasharray="6 4"/><text class="sm" x="380" y="216" text-anchor="middle">ponto de virada</text><rect x="468" y="104" width="56" height="66" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><rect x="530" y="126" width="56" height="44" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="526" y="192" text-anchor="middle">6:4</text><rect x="614" y="115" width="56" height="55" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><rect x="676" y="115" width="56" height="55" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="672" y="192" text-anchor="middle">5:5</text><rect x="596" y="60" width="12" height="12" fill="url(#h1)" stroke="#000"/><text class="xs" x="614" y="70">material A</text><rect x="596" y="80" width="12" height="12" fill="url(#h3)" stroke="#000"/><text class="xs" x="614" y="90">material B</text><text class="xs" x="30" y="240">Cheire as cinco. O que importa não é a "melhor" — é achar onde o acorde vira outra coisa.</text></svg>