<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="Por que o EDT parece mais forte que o parfum"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="272" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Por que o EDT parece mais forte que o parfum</text><g transform="translate(60,52)"><line class="ln" x1="0" y1="170" x2="640" y2="170"/><line class="ln" x1="0" y1="0" x2="0" y2="170"/><path d="M0 20 C 80 18, 160 70, 300 130 S 460 168, 520 169" stroke="#000" stroke-width="2.4" stroke-dasharray="none" fill="none"/><line x1="360" y1="8" x2="382" y2="8" stroke="#000" stroke-width="2.4" stroke-dasharray="none"/><text class="xs" x="385" y="12">EDT 5–15%</text><path d="M0 55 C 100 48, 220 78, 360 120 S 540 162, 640 168" stroke="#000" stroke-width="2.0" stroke-dasharray="7 4" fill="none"/><line x1="456" y1="8" x2="478" y2="8" stroke="#000" stroke-width="2.0" stroke-dasharray="7 4"/><text class="xs" x="481" y="12">EDP 15–20%</text><path d="M0 95 C 120 88, 260 95, 400 112 S 560 140, 640 152" stroke="#000" stroke-width="2.0" stroke-dasharray="2.5 3.5" fill="none"/><line x1="552" y1="8" x2="574" y2="8" stroke="#000" stroke-width="2.0" stroke-dasharray="2.5 3.5"/><text class="xs" x="577" y="12">Parfum 20–40%</text><text class="xs" x="0" y="190">tempo →</text><text class="xs" x="-40" y="10" transform="rotate(-90,-40,10)">projeção</text></g><text class="sm" x="20" y="258">Concentração alta ≠ projeção alta. O EDT tem mais topo e mais álcool: sai tudo de uma vez.</text></svg>