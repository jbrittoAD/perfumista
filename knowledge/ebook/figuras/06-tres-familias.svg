<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-label="As três famílias de produto de limpeza"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="212" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">As três famílias de produto de limpeza</text><rect x="22" y="56" width="228" height="116" rx="8" fill="#dcdcdc" stroke="#000" stroke-width="1.3"/><text class="ttl" x="38" y="82">SABÃO</text><text class="sm" x="38" y="102">gordura + soda</text><text class="lbl" x="38" y="128">pH 9–10</text><text class="xs" x="38" y="148">álcali come o perfume;</text><text class="xs" x="38" y="163">resseca mais</text><rect x="268" y="56" width="228" height="116" rx="8" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/><text class="ttl" x="284" y="82">SYNDET</text><text class="sm" x="284" y="102">tensoativo sintético</text><text class="lbl" x="284" y="128">pH 5,0–5,5</text><text class="xs" x="284" y="148">não resseca;</text><text class="xs" x="284" y="163">é o "tipo Dove"</text><rect x="514" y="56" width="228" height="116" rx="8" fill="#dcdcdc" stroke="#000" stroke-width="1.3"/><text class="ttl" x="530" y="82">EMULSÃO</text><text class="sm" x="530" y="102">água + óleo</text><text class="lbl" x="530" y="128">pH 5,0–5,5</text><text class="xs" x="530" y="148">tem água →</text><text class="xs" x="530" y="163">conservante obrigatório</text><text class="sm" x="22" y="196">Saber em qual dos três você está resolve 80% do que pode dar errado.</text></svg>