<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" role="img" aria-label="Quanto cabe em cada base"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="292" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Quanto cabe em cada base</text><text class="lbl" x="20" y="72">Base glicerinada</text><text class="xs" x="20" y="88">aditivo total, incluindo o perfume</text><rect x="330" y="60" width="90" height="22" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="428" y="76">6%</text><text class="lbl" x="20" y="124">Syndet</text><text class="xs" x="20" y="140">gordura somada (óleo + manteiga + éster)</text><rect x="330" y="112" width="150" height="22" rx="3" fill="url(#h2)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="488" y="128">10%</text><text class="lbl" x="20" y="176">Cold process</text><text class="xs" x="20" y="192">superfat; perfume 3% dos óleos</text><rect x="330" y="164" width="75" height="22" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="413" y="180">5%</text><text class="lbl" x="20" y="228">Emulsão (Olivem 1000)</text><text class="xs" x="20" y="244">fase oleosa; perfume ≤1%</text><rect x="330" y="216" width="330" height="22" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="668" y="232">22%</text><text class="sm" x="20" y="278">Passar do teto não "hidrata mais": amolece a barra, corta a espuma e quebra a emulsão.</text></svg>