<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-label="Sal em shampoo líquido: a curva em sino"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="266" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Sal em shampoo líquido: a curva em sino</text><g transform="translate(60,52)"><line class="ln" x1="0" y1="160" x2="620" y2="160"/><line class="ln" x1="0" y1="0" x2="0" y2="160"/><path d="M0 150 C 90 130, 150 40, 250 30 S 420 70, 620 150" stroke="#000" stroke-width="2.6" fill="none"/><circle cx="250" cy="30" r="5" fill="#000"/><text class="sm" x="262" y="28">pico de viscosidade</text><line x1="250" y1="36" x2="250" y2="160" stroke="#000" stroke-width="1" stroke-dasharray="3 3"/><text class="xs" x="420" y="110">passou daqui, AFINA de novo</text><text class="xs" x="0" y="178" text-anchor="middle">0%</text><text class="xs" x="155" y="178" text-anchor="middle">1%</text><text class="xs" x="310" y="178" text-anchor="middle">2%</text><text class="xs" x="465" y="178" text-anchor="middle">3%</text><text class="xs" x="620" y="178" text-anchor="middle">4%</text><text class="xs" x="-36" y="10" transform="rotate(-90,-36,10)">viscosidade</text></g><text class="sm" x="20" y="252">Suba de 0,2% em 0,2%, medindo. Quem joga o sal de uma vez passa do pico e acha que "não engrossa".</text></svg>