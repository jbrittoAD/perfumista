<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="190" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">A escada de diluição</text><rect x="20" y="58" width="164" height="90" rx="8" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/><text class="ttl" x="34" y="86">100%</text><text class="xs" x="34" y="108">material puro</text><text class="xs" x="34" y="128">frasco do fornecedor</text><path class="ar" d="M188 103 L 202 103"/><rect x="206" y="58" width="164" height="90" rx="8" fill="#dcdcdc" stroke="#000" stroke-width="1.3"/><text class="ttl" x="220" y="86">10%</text><text class="xs" x="220" y="108">2,4 g + álcool até 24 g</text><text class="xs" x="220" y="128">o estoque de trabalho</text><path class="ar" d="M374 103 L 388 103"/><rect x="392" y="58" width="164" height="90" rx="8" fill="#f0f0f0" stroke="#000" stroke-width="1.3"/><text class="ttl" x="406" y="86">1%</text><text class="xs" x="406" y="108">240 mg + álcool até 24 g</text><text class="xs" x="406" y="128">aldeídos · indol · damascones</text><path class="ar" d="M560 103 L 574 103"/><rect x="578" y="58" width="164" height="90" rx="8" fill="#dcdcdc" stroke="#000" stroke-width="1.3"/><text class="ttl" x="592" y="86">0,5%</text><text class="xs" x="592" y="108">120 mg + álcool até 24 g</text><text class="xs" x="592" y="128">extremos</text><text class="sm" x="20" y="176">Frasco de 30 ml comporta 24 g de solução. BHT 0,1% (24 mg) em todas. Rotule ANTES de encher.</text></svg>