<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-label="Por que limpar e condicionar juntos é difícil"><style>
  .bg{fill:#fff}
  .ttl{font:700 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#000}
  .lbl{font:600 12.5px system-ui,sans-serif;fill:#000}
  .sm{font:500 11px system-ui,sans-serif;fill:#333}
  .xs{font:500 10px system-ui,sans-serif;fill:#555}
  .box{fill:#f2f2f2;stroke:#000;stroke-width:1.1}
  .ln{stroke:#000;stroke-width:1.1;fill:none}
  .ar{stroke:#000;stroke-width:1.4;fill:none;marker-end:url(#a)}
  text{fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#000"/></marker>
<pattern id="h1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/></pattern>
<pattern id="h2" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/></pattern>
<pattern id="h3" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#000"/></pattern>
</defs><rect class="bg" width="760" height="222" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Por que limpar e condicionar juntos é difícil</text><rect x="24" y="56" width="330" height="150" rx="8" class="box"/><text class="lbl" x="42" y="80">No frasco / na barra</text><circle cx="90" cy="122" r="20" fill="#111"/><text class="xs" x="90" y="127" text-anchor="middle" fill="#fff">−</text><circle cx="170" cy="122" r="20" fill="#fff" stroke="#000" stroke-width="2"/><text class="xs" x="170" y="127" text-anchor="middle">+</text><path class="ar" d="M116 120 L 144 120"/><path class="ar" d="M144 134 L 116 134"/><text class="sm" x="206" y="116">aniônico + catiônico</text><text class="lbl" x="206" y="134">se atraem e precipitam</text><text class="xs" x="42" y="186">limpa menos E condiciona menos: o pior dos dois</text><rect x="392" y="56" width="344" height="150" rx="8" fill="#fff" stroke="#000" stroke-width="1.8"/><text class="lbl" x="410" y="80">A saída: polímero catiônico (guar)</text><rect x="410" y="100" width="130" height="44" rx="6" fill="#f2f2f2" stroke="#000"/><text class="xs" x="475" y="120" text-anchor="middle">estável dentro</text><text class="xs" x="475" y="134" text-anchor="middle">do produto</text><path class="ar" d="M546 122 L 572 122"/><text class="xs" x="559" y="96" text-anchor="middle">+ água</text><rect x="578" y="100" width="142" height="44" rx="6" fill="#fff" stroke="#000" stroke-width="1.6" stroke-dasharray="4 3"/><text class="xs" x="649" y="120" text-anchor="middle">precipita no fio</text><text class="xs" x="649" y="134" text-anchor="middle">(coacervação)</text><text class="xs" x="410" y="186">é isso que torna a barra 3-em-1 possível</text></svg>