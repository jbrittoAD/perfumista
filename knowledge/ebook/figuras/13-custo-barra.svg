</defs><rect class="bg" width="760" height="292" rx="10" stroke="#000" stroke-width="0.8"/><text class="ttl" x="20" y="28">Custo por barra de 100 g</text><text class="lbl" x="20" y="72">Cold process (sebo)</text><text class="xs" x="20" y="88">+ 4 a 6 semanas de cura</text><rect x="330" y="60" width="88" height="22" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="426" y="76">R$ 3,50</text><text class="lbl" x="20" y="124">Base glicerinada</text><text class="xs" x="20" y="140">pronta em 24 h; barra macia</text><rect x="330" y="112" width="91" height="22" rx="3" fill="url(#h2)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="429" y="128">R$ 3,60</text><text class="lbl" x="20" y="176">Syndet — SCI em 2 kg</text><text class="xs" x="20" y="192">o produto que você quer vender</text><rect x="330" y="164" width="116" height="22" rx="3" fill="url(#h3)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="454" y="180">R$ 4,60</text><text class="lbl" x="20" y="228">Syndet — SCI fracionado</text><text class="xs" x="20" y="244">mesmo produto, compra errada</text><rect x="330" y="216" width="300" height="22" rx="3" fill="url(#h1)" stroke="#000" stroke-width="1.1"/><text class="lbl" x="638" y="232">R$ 11,80</text><text class="sm" x="20" y="278">O mesmo SCI em pote de 250 g custa 4,3× mais por quilo do que em 2 kg. É só isso que separa as duas últimas.</text></svg>